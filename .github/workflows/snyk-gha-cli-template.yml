name: Template Workflow

on: 
    workflow_call:
      inputs:
        flag_code:
          required: false
          type: string
        flag_test:
          required: false
          type: string
        flag_iac:
          required: false
          type: string
      secrets:
        SNYK_TOKEN:
          required: true
jobs:
  Setup-and-run-snyk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v2

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate Snyk
        run: |
          export SNYK_TOKEN=${{ secrets.SNYK_TOKEN }}
          snyk auth $SNYK_TOKEN --auth-type=token
    
      - name: Run Snyk Code Test
        run: snyk code test ${{ inputs.flag_code }}
        continue-on-error: true

      - name: Run Snyk Open Source Test
        run: snyk test ${{ inputs.flag_test }}
        continue-on-error: true

      - name: Run Snyk Container Test
        run: snyk container ${{ inputs.flag_iac }}
        continue-on-error: true
